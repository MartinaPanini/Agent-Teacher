<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 298" role="img" aria-label="Tre livelli: le description di tutte le skill stanno sempre in contesto, il corpo entra quando la skill viene invocata, i file di riferimento si aprono solo se servono">
<title>Tre livelli: le description di tutte le skill stanno sempre in contesto, il corpo entra quando la skill viene invocata, i file di riferimento si aprono solo se servono</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#B4563C"/></marker></defs>
<text x="300" y="22" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12.5" fill="#141413">tre livelli, tre momenti diversi</text><rect x="46" y="48" width="508" height="52" rx="10" fill="#F7EDE9" stroke="#B4563C" stroke-width="2"/><text x="63" y="79.0" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="13" fill="#B4563C"></text><text x="64" y="70" text-anchor="start" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12.5" fill="#B4563C">le description di tutte le skill</text><text x="64" y="88" text-anchor="start" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11" fill="#6E6A5E">sempre in contesto, poche righe</text><circle cx="28" cy="74" r="11" fill="#B4563C"/><text x="28" y="78" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF">1</text><rect x="46" y="114" width="508" height="52" rx="10" fill="#E7EEED" stroke="#3F6C6A" stroke-width="2"/><text x="63" y="145.0" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="13" fill="#1F3B39"></text><text x="64" y="136" text-anchor="start" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12.5" fill="#3F6C6A">il corpo della skill</text><text x="64" y="154" text-anchor="start" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11" fill="#6E6A5E">entra quando la skill viene invocata</text><circle cx="28" cy="140" r="11" fill="#B4563C"/><text x="28" y="144" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF">2</text><rect x="46" y="180" width="508" height="52" rx="10" fill="#FFFDF8" stroke="#141413" stroke-width="2" stroke-dasharray="6 5"/><text x="63" y="211.0" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="13" fill="#141413"></text><text x="64" y="202" text-anchor="start" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12.5" fill="#141413">i file di riferimento che cita</text><text x="64" y="220" text-anchor="start" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11" fill="#6E6A5E">si aprono solo se servono davvero</text><circle cx="28" cy="206" r="11" fill="#B4563C"/><text x="28" y="210" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF">3</text><text x="300" y="262" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12" fill="#141413">Materiale di riferimento lungo non costa quasi niente finché non serve.</text><text x="300" y="282" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12" fill="#B4563C">Ma una skill caricata resta in contesto fino a fine sessione.</text>
</svg>
