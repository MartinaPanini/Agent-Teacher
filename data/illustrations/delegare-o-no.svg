<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 390" role="img" aria-label="Delega quando il compito produce output verboso, si chiude con un riassunto o corre in parallelo; non delegare quando serve avanti e indietro, quando le fasi condividono contesto o quando conta la latenza">
<title>Delega quando il compito produce output verboso, si chiude con un riassunto o corre in parallelo; non delegare quando serve avanti e indietro, quando le fasi condividono contesto o quando conta la latenza</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#B4563C"/></marker></defs>
<text x="160" y="22" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12.5" fill="#141413">delegare o tenere</text><rect x="14" y="44" width="292" height="36" rx="10" fill="#E7EEED" stroke="#3F6C6A" stroke-width="2"/><text x="31" y="67.0" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="13" fill="#1F3B39"></text><text x="30" y="67" text-anchor="start" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11" fill="#3F6C6A">output verboso che non rileggerai</text><rect x="14" y="90" width="292" height="36" rx="10" fill="#E7EEED" stroke="#3F6C6A" stroke-width="2"/><text x="31" y="113.0" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="13" fill="#1F3B39"></text><text x="30" y="113" text-anchor="start" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11" fill="#3F6C6A">compito che si chiude con un riassunto</text><rect x="14" y="136" width="292" height="36" rx="10" fill="#E7EEED" stroke="#3F6C6A" stroke-width="2"/><text x="31" y="159.0" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="13" fill="#1F3B39"></text><text x="30" y="159" text-anchor="start" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11" fill="#3F6C6A">rami indipendenti in parallelo</text><rect x="14" y="200" width="292" height="36" rx="10" fill="#FFFDF8" stroke="#141413" stroke-width="2" stroke-dasharray="6 5"/><text x="31" y="223.0" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="13" fill="#141413"></text><text x="30" y="223" text-anchor="start" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11" fill="#6E6A5E">serve avanti e indietro con te</text><rect x="14" y="246" width="292" height="36" rx="10" fill="#FFFDF8" stroke="#141413" stroke-width="2" stroke-dasharray="6 5"/><text x="31" y="269.0" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="13" fill="#141413"></text><text x="30" y="269" text-anchor="start" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11" fill="#6E6A5E">le fasi condividono contesto</text><rect x="14" y="292" width="292" height="36" rx="10" fill="#FFFDF8" stroke="#141413" stroke-width="2" stroke-dasharray="6 5"/><text x="31" y="315.0" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="13" fill="#141413"></text><text x="30" y="315" text-anchor="start" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11" fill="#6E6A5E">modifica piccola, o conta la latenza</text><text x="160" y="196" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" fill="#6E6A5E">non delegare quando</text><text x="160" y="38" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" fill="#3F6C6A">delega quando</text><text x="160" y="358" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" fill="#B4563C">La domanda: quale pezzo di lavoro sporcherebbe</text><text x="160" y="374" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" fill="#B4563C">la finestra di qualcun altro?</text>
</svg>
