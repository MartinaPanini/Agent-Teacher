<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 306" role="img" aria-label="Dove va scritta una regola: una convenzione in CLAUDE.md, una procedura lunga in una skill, una cosa che deve accadere sempre in un hook">
<title>Dove va scritta una regola: una convenzione in CLAUDE.md, una procedura lunga in una skill, una cosa che deve accadere sempre in un hook</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#B4563C"/></marker></defs>
<text x="160" y="22" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12.5" fill="#141413">dove va scritta una regola</text><rect x="14" y="40" width="292" height="62" rx="10" fill="#FFFDF8" stroke="#141413" stroke-width="2"/><text x="31" y="76.0" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="13" fill="#141413"></text><text x="30" y="66" text-anchor="start" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" fill="#6E6A5E">una convenzione o una preferenza</text><text x="30" y="86" text-anchor="start" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="13" fill="#141413">CLAUDE.md</text><rect x="14" y="118" width="292" height="62" rx="10" fill="#FFFDF8" stroke="#141413" stroke-width="2"/><text x="31" y="154.0" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="13" fill="#141413"></text><text x="30" y="144" text-anchor="start" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" fill="#6E6A5E">una procedura lunga, ogni tanto</text><text x="30" y="164" text-anchor="start" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="13" fill="#141413">una skill</text><rect x="14" y="196" width="292" height="62" rx="10" fill="#E7EEED" stroke="#3F6C6A" stroke-width="2"/><text x="31" y="232.0" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="13" fill="#1F3B39"></text><text x="30" y="222" text-anchor="start" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" fill="#6E6A5E">deve accadere sempre, in un punto preciso</text><text x="30" y="242" text-anchor="start" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="13" fill="#3F6C6A">un hook</text><text x="160" y="292" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="10.5" fill="#B4563C">Se deve valere anche quando il modello si distrae, è un hook.</text>
