<text x="300" y="24" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12.5" fill="#141413">la domanda è la stessa; l'input no</text><text x="16" y="74" text-anchor="start" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12" fill="#141413">turno 1</text><rect x="84.0" y="52" width="110.0" height="32" rx="6" fill="#E7EEED" stroke="#3F6C6A" stroke-width="1.8"/><text x="139.0" y="72.0" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10.5" fill="#1F3B39">fisso</text><text x="208" y="73" text-anchor="start" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11" fill="#6E6A5E">=110 unita</text><text x="16" y="136" text-anchor="start" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12" fill="#141413">turno 5</text><rect x="84.0" y="114" width="108.6" height="32" rx="6" fill="#E7EEED" stroke="#3F6C6A" stroke-width="1.8"/><text x="138.3" y="134.0" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10.5" fill="#1F3B39">fisso</text><rect x="195.6" y="114" width="118.4" height="32" rx="6" fill="#F7EDE9" stroke="#B4563C" stroke-width="1.8"/><text x="254.8" y="134.0" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10.5" fill="#B4563C">storico accumulato</text><text x="328" y="135" text-anchor="start" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11" fill="#6E6A5E">=230 unita</text><text x="16" y="198" text-anchor="start" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12" fill="#141413">turno 10</text><rect x="84.0" y="176" width="109.1" height="32" rx="6" fill="#E7EEED" stroke="#3F6C6A" stroke-width="1.8"/><text x="138.6" y="196.0" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10.5" fill="#1F3B39">fisso</text><rect x="196.1" y="176" width="267.9" height="32" rx="6" fill="#F7EDE9" stroke="#B4563C" stroke-width="1.8"/><text x="330.1" y="196.0" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10.5" fill="#B4563C">storico accumulato</text><text x="478" y="197" text-anchor="start" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11" fill="#6E6A5E">=380 unita</text><text x="16" y="240" text-anchor="start" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" fill="#141413">Il blocco «fisso» sono definizioni degli strumenti e system prompt:</text><text x="16" y="256" text-anchor="start" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" fill="#141413">non cresce, ma lo rispedisci ogni volta. Il resto si accumula.</text>
