<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 292" role="img" aria-label="I tre sintomi di una sessione lunga che degrada: dimentica un vincolo dato all'inizio, rifà una cosa già fatta, perde il filo">
<title>I tre sintomi di una sessione lunga che degrada: dimentica un vincolo dato all'inizio, rifà una cosa già fatta, perde il filo</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#B4563C"/></marker></defs>
<text x="160" y="24" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12" fill="#141413">una sessione lunga, dall'alto in basso</text><line x1="40" y1="44" x2="40" y2="238" stroke="#D3CEC0" stroke-width="3"/><circle cx="40" cy="70" r="7" fill="#B4563C"/><text x="60" y="68" text-anchor="start" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12.5" fill="#141413">dimentica un vincolo</text><text x="60" y="84" text-anchor="start" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11" fill="#6E6A5E">che avevi dato all'inizio</text><circle cx="40" cy="132" r="7" fill="#B4563C"/><text x="60" y="130" text-anchor="start" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12.5" fill="#141413">rifà una cosa già fatta</text><text x="60" y="146" text-anchor="start" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11" fill="#6E6A5E">senza accorgersene</text><circle cx="40" cy="194" r="7" fill="#B4563C"/><text x="60" y="192" text-anchor="start" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12.5" fill="#141413">perde il filo</text><text x="60" y="208" text-anchor="start" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11" fill="#6E6A5E">e tu non hai cambiato niente</text><text x="16" y="262" text-anchor="start" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" fill="#141413">Non hai cambiato modello né chiesto qualcosa di più</text><text x="16" y="278" text-anchor="start" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" fill="#B4563C">difficile. Si è riempita la finestra.</text>
</svg>
