<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 236" role="img" aria-label="La cache legge il prompt in ordine, da tools a system ai messaggi, fino al blocco marcato con cache_control: quel tratto iniziale è il prefisso riusato">
<title>La cache legge il prompt in ordine, da tools a system ai messaggi, fino al blocco marcato con cache_control: quel tratto iniziale è il prefisso riusato</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#B4563C"/></marker></defs>
<text x="300" y="24" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12.5" fill="#141413">la cache legge il prompt in ordine, dall'inizio</text><rect x="14.0" y="48" width="168.0" height="44" rx="6" fill="#E7EEED" stroke="#3F6C6A" stroke-width="1.8"/><text x="98.0" y="74.0" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10.5" fill="#1F3B39">tools</text><rect x="185.0" y="48" width="145.6" height="44" rx="6" fill="#FFFDF8" stroke="#141413" stroke-width="1.8"/><text x="257.8" y="74.0" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10.5" fill="#141413">system</text><rect x="333.6" y="48" width="123.2" height="44" rx="6" fill="#F7EDE9" stroke="#B4563C" stroke-width="1.8"/><text x="395.2" y="74.0" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10.5" fill="#B4563C">messages, turno 1</text><rect x="459.8" y="48" width="67.2" height="44" rx="6" fill="#F7EDE9" stroke="#B4563C" stroke-width="1.8"/><text x="493.4" y="74.0" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10.5" fill="#B4563C">turno 2</text><rect x="530.0" y="48" width="56.0" height="44" rx="6" fill="#EFECE7" stroke="#A9A497" stroke-width="1.8"/><text x="558.0" y="74.0" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10.5" fill="#6E6A5E">turno 3</text><line x1="326" y1="40" x2="326" y2="104" stroke="#B4563C" stroke-width="2.5" stroke-dasharray="5 4"/><text x="334" y="44" text-anchor="start" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="11" fill="#B4563C">cache_control</text><path d="M14 112 L14 120 L326 120 L326 112" fill="none" stroke="#141413" stroke-width="1.5"/><text x="170" y="138" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12" fill="#141413">questo è il prefisso: quello che viene riusato</text><text x="456" y="138" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12" fill="#6E6A5E">questo si rielabora sempre</text><text x="300" y="180" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12" fill="#141413">Non è una cache a pezzi. È una cache dell'inizio della richiesta:</text><text x="300" y="198" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12" fill="#141413">cambiare un blocco prima del punto marcato cambia l'hash, e la</text><text x="300" y="216" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12" fill="#141413">corrispondenza non si trova più.</text>
</svg>
