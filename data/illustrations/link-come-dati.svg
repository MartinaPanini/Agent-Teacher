<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 290" role="img" aria-label="I collegamenti fra note sono scritti dentro il testo con le doppie parentesi quadre: una regex ricostruisce il grafo senza aprire Obsidian, ma un agente che rinomina un file da fuori rompe i riferimenti">
<title>I collegamenti fra note sono scritti dentro il testo con le doppie parentesi quadre: una regex ricostruisce il grafo senza aprire Obsidian, ma un agente che rinomina un file da fuori rompe i riferimenti</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#B4563C"/></marker></defs>
<text x="300" y="22" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12.5" fill="#141413">il grafo sta dentro il testo</text><rect x="14" y="40" width="250" height="104" rx="10" fill="#FFFDF8" stroke="#141413" stroke-width="2"/><text x="31" y="68" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="13" fill="#141413">fisica.md</text><text x="31" y="85" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" fill="#6E6A5E">una nota qualsiasi</text><text x="30" y="104" text-anchor="start" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="11.5" fill="#B4563C">Vedi [[Tre leggi del moto]]</text><text x="30" y="126" text-anchor="start" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="11.5" fill="#B4563C">e [[Attrito#Statico]].</text><rect x="336" y="30" width="250" height="46" rx="10" fill="#E7EEED" stroke="#3F6C6A" stroke-width="2"/><text x="353" y="58.0" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="13" fill="#1F3B39">Tre leggi del moto</text><rect x="336" y="108" width="250" height="46" rx="10" fill="#E7EEED" stroke="#3F6C6A" stroke-width="2"/><text x="353" y="136.0" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="13" fill="#1F3B39">Attrito</text><line x1="270" y1="86" x2="330" y2="56" stroke="#B4563C" stroke-width="2.5" marker-end="url(#ar)"/><line x1="270" y1="110" x2="330" y2="128" stroke="#B4563C" stroke-width="2.5" marker-end="url(#ar)"/><text x="300" y="186" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12" fill="#141413">I link sono dati leggibili: una regex su [[...]] ricostruisce</text><text x="300" y="204" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12" fill="#141413">il grafo delle relazioni senza aprire Obsidian.</text><rect x="90" y="224" width="420" height="50" rx="10" fill="#F7EDE9" stroke="#B4563C" stroke-width="2"/><text x="107" y="254.0" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="13" fill="#B4563C"></text><text x="300" y="246" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" fill="#B4563C">Rinominando da dentro Obsidian i link si aggiornano.</text><text x="300" y="263" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" fill="#B4563C">Un agente che rinomina da fuori li rompe in silenzio.</text>
