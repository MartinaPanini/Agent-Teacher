<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 300" role="img" aria-label="Su venti note dare tutto all'agente funziona; su duemila la finestra si riempie di materiale irrilevante e le risposte peggiorano mentre il vault cresce">
<title>Su venti note dare tutto all'agente funziona; su duemila la finestra si riempie di materiale irrilevante e le risposte peggiorano mentre il vault cresce</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#B4563C"/></marker></defs>
<text x="160" y="22" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12.5" fill="#141413">lo stesso metodo, due scale</text><rect x="14" y="44" width="292" height="80" rx="10" fill="#E7EEED" stroke="#3F6C6A" stroke-width="2"/><text x="31" y="72" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="13" fill="#1F3B39">venti note</text><text x="31" y="89" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" fill="#3F6C6A">dagliele tutte: funziona</text><rect x="14" y="148" width="292" height="80" rx="10" fill="#FFFDF8" stroke="#141413" stroke-width="2" stroke-dasharray="6 5"/><text x="31" y="176" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="13" fill="#141413">duemila note</text><text x="31" y="193" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" fill="#6E6A5E">dagliele tutte: peggiora</text><text x="30" y="206" text-anchor="start" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11" fill="#6E6A5E">la finestra si riempie di materiale irrilevante</text><text x="160" y="260" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12" fill="#141413">Il second brain utile non è «l'agente legge tutto».</text><text x="160" y="284" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12" fill="#B4563C">È «l'agente cerca, apre tre note e cita quelle».</text>
</svg>
