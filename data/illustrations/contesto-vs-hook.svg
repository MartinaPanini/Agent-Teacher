<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 318" role="img" aria-label="CLAUDE.md è contesto: il modello lo legge e prova a seguirlo. Un hook è configurazione: il programma lo esegue da sé, senza consultare il modello">
<title>CLAUDE.md è contesto: il modello lo legge e prova a seguirlo. Un hook è configurazione: il programma lo esegue da sé, senza consultare il modello</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#B4563C"/></marker></defs>
<rect x="14" y="24" width="292" height="92" rx="10" fill="#FFFDF8" stroke="#141413" stroke-width="2"/><text x="31" y="52" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="13" fill="#141413">CLAUDE.md</text><text x="31" y="69" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" fill="#6E6A5E">contesto</text><text x="30" y="86" text-anchor="start" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" fill="#6E6A5E">il modello lo legge e prova a seguirlo</text><text x="30" y="102" text-anchor="start" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" fill="#6E6A5E">otto volte su dieci funziona</text><rect x="14" y="168" width="292" height="92" rx="10" fill="#E7EEED" stroke="#3F6C6A" stroke-width="2"/><text x="31" y="196" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="13" fill="#1F3B39">hook</text><text x="31" y="213" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" fill="#3F6C6A">configurazione</text><text x="30" y="230" text-anchor="start" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" fill="#3F6C6A">il programma lo esegue da sé, sempre</text><text x="30" y="246" text-anchor="start" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" fill="#3F6C6A">il modello non viene consultato</text><text x="160" y="142" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12" fill="#B4563C">le istruzioni guidano, gli hook impongono</text><text x="160" y="286" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12" fill="#141413">«e se il modello decidesse di no?»</text><text x="160" y="302" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12" fill="#141413">Se «non è accettabile», è un hook.</text>
</svg>
