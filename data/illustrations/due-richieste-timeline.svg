<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" role="img" aria-label="Due richieste all'API per una sola chiamata a uno strumento: la prima torna con stop_reason tool_use, in mezzo il tuo codice esegue, la seconda torna con il testo finale">
<title>Due richieste all'API per una sola chiamata a uno strumento: la prima torna con stop_reason tool_use, in mezzo il tuo codice esegue, la seconda torna con il testo finale</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#B4563C"/></marker></defs>
<rect x="10" y="70" width="170" height="76" rx="10" fill="#FFFDF8" stroke="#141413" stroke-width="2"/><text x="27" y="98" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="13" fill="#141413">Richiesta 1</text><text x="27" y="115" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" fill="#6E6A5E">tools[] + messages[]</text><rect x="215" y="70" width="170" height="76" rx="10" fill="#E7EEED" stroke="#3F6C6A" stroke-width="2" stroke-dasharray="6 5"/><text x="232" y="98" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="13" fill="#1F3B39">fuori dall'API</text><text x="232" y="115" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" fill="#3F6C6A">il tuo codice esegue</text><rect x="420" y="70" width="170" height="76" rx="10" fill="#FFFDF8" stroke="#141413" stroke-width="2"/><text x="437" y="98" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="13" fill="#141413">Richiesta 2</text><text x="437" y="115" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" fill="#6E6A5E">tutto + tool_result</text><line x1="186" y1="108" x2="209" y2="108" stroke="#B4563C" stroke-width="2.5" marker-end="url(#ar)"/><line x1="391" y1="108" x2="414" y2="108" stroke="#B4563C" stroke-width="2.5" marker-end="url(#ar)"/><circle cx="197" cy="46" r="11" fill="#B4563C"/><text x="197" y="50" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF">2</text><circle cx="402" cy="46" r="11" fill="#B4563C"/><text x="402" y="50" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF">3</text><circle cx="95" cy="46" r="11" fill="#B4563C"/><text x="95" y="50" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF">1</text><text x="95" y="176" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="11.5" fill="#B4563C">torna stop_reason: tool_use</text><text x="95" y="194" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" fill="#6E6A5E">con il blocco tool_use</text><text x="505" y="176" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="11.5" fill="#B4563C">torna stop_reason: end_turn</text><text x="505" y="194" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" fill="#6E6A5E">ed è il testo che leggi</text><text x="300" y="232" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12" fill="#141413">La richiesta HTTP si chiude qui: il modello non sta aspettando.</text><text x="300" y="250" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12" fill="#6E6A5E">Se non fai nient'altro, non succede nient'altro.</text><text x="300" y="30" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12.5" fill="#141413">due richieste all'API per una sola chiamata a uno strumento</text>
</svg>
