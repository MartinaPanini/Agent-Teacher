<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" role="img" aria-label="A sinistra i rimedi che attaccano la causa del context rot: compattare, appunti esterni, recupero al momento giusto, sottoagenti. A destra i due che spostano il limite senza toglierlo">
<title>A sinistra i rimedi che attaccano la causa del context rot: compattare, appunti esterni, recupero al momento giusto, sottoagenti. A destra i due che spostano il limite senza toglierlo</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#B4563C"/></marker></defs>
<text x="300" y="24" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12.5" fill="#141413">due liste che non si somigliano</text><rect x="14" y="48" width="268" height="42" rx="10" fill="#E7EEED" stroke="#3F6C6A" stroke-width="2"/><text x="31" y="74.0" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="13" fill="#1F3B39"></text><text x="30" y="74" text-anchor="start" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" fill="#3F6C6A">compattare e ripartire</text><rect x="14" y="100" width="268" height="42" rx="10" fill="#E7EEED" stroke="#3F6C6A" stroke-width="2"/><text x="31" y="126.0" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="13" fill="#1F3B39"></text><text x="30" y="126" text-anchor="start" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" fill="#3F6C6A">appunti in un file esterno</text><rect x="14" y="152" width="268" height="42" rx="10" fill="#E7EEED" stroke="#3F6C6A" stroke-width="2"/><text x="31" y="178.0" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="13" fill="#1F3B39"></text><text x="30" y="178" text-anchor="start" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" fill="#3F6C6A">aprire i dati quando servono</text><rect x="14" y="204" width="268" height="42" rx="10" fill="#E7EEED" stroke="#3F6C6A" stroke-width="2"/><text x="31" y="230.0" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="13" fill="#1F3B39"></text><text x="30" y="230" text-anchor="start" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" fill="#3F6C6A">sottoagenti con contesto proprio</text><rect x="318" y="48" width="268" height="42" rx="10" fill="#FFFDF8" stroke="#141413" stroke-width="2" stroke-dasharray="6 5"/><text x="335" y="74.0" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="13" fill="#141413"></text><text x="346" y="74" text-anchor="start" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" fill="#6E6A5E">una finestra più grande</text><line x1="330" y1="58" x2="342" y2="76" stroke="#6E6A5E" stroke-width="2"/><line x1="342" y1="58" x2="330" y2="76" stroke="#6E6A5E" stroke-width="2"/><rect x="318" y="100" width="268" height="42" rx="10" fill="#FFFDF8" stroke="#141413" stroke-width="2" stroke-dasharray="6 5"/><text x="335" y="126.0" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="13" fill="#141413"></text><text x="346" y="126" text-anchor="start" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" fill="#6E6A5E">chiedere di fare più attenzione</text><line x1="330" y1="110" x2="342" y2="128" stroke="#6E6A5E" stroke-width="2"/><line x1="342" y1="110" x2="330" y2="128" stroke="#6E6A5E" stroke-width="2"/><text x="148" y="42" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" fill="#3F6C6A">attaccano la causa</text><text x="452" y="42" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" fill="#6E6A5E">spostano il limite e basta</text><text x="300" y="268" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" fill="#141413">La finestra più grande non toglie il degrado: è esattamente</text><text x="300" y="284" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" fill="#141413">quello che il fenomeno descrive.</text>
</svg>
