<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 290" role="img" aria-label="Una definizione di strumento ha tre campi: name, description e input_schema. Solo description e input_schema sono ciò che il modello vede; il codice che esegue lo strumento non gli arriva mai">
<title>Una definizione di strumento ha tre campi: name, description e input_schema. Solo description e input_schema sono ciò che il modello vede; il codice che esegue lo strumento non gli arriva mai</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#B4563C"/></marker></defs>
<rect x="14" y="18" width="292" height="150" rx="10" fill="#FFFDF8" stroke="#141413" stroke-width="2"/><text x="31" y="98.0" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="13" fill="#141413"></text><text x="30" y="44" text-anchor="start" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="13" fill="#141413">name</text><text x="30" y="60" text-anchor="start" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" fill="#6E6A5E">identificatore, ^[a-zA-Z0-9_-]{1,128}$</text><line x1="14" y1="72" x2="306" y2="72" stroke="#D3CEC0" stroke-width="1.5"/><rect x="15" y="73" width="290" height="46" fill="#F7EDE9"/><text x="30" y="94" text-anchor="start" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="13" fill="#B4563C">description</text><text x="30" y="110" text-anchor="start" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" fill="#6E6A5E">cosa fa, quando si usa, quando no</text><line x1="14" y1="120" x2="306" y2="120" stroke="#D3CEC0" stroke-width="1.5"/><rect x="15" y="121" width="290" height="46" fill="#E7EEED"/><text x="30" y="142" text-anchor="start" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="13" fill="#3F6C6A">input_schema</text><text x="30" y="158" text-anchor="start" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" fill="#6E6A5E">la forma dell'input, in JSON Schema</text><path d="M296 78 q8 0 8 10 v25 q0 10 10 10 q-10 0 -10 10 v25 q0 10 -10 10" fill="none" stroke="#B4563C" stroke-width="1.5"/><rect x="14" y="206" width="292" height="62" rx="10" fill="#FFFDF8" stroke="#141413" stroke-width="2" stroke-dasharray="6 5"/><text x="31" y="234" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="13" fill="#141413">il codice che esegue</text><text x="31" y="251" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" fill="#6E6A5E">il modello non lo vede mai</text><text x="160" y="194" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" fill="#B4563C">l'unica superficie su cui il modello decide</text>
</svg>
