<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 290" role="img" aria-label="Il blocco tool_use porta un id; il blocco tool_result riporta lo stesso valore in tool_use_id, ed e questo che accoppia la richiesta al suo risultato">
<title>Il blocco tool_use porta un id; il blocco tool_result riporta lo stesso valore in tool_use_id, ed e questo che accoppia la richiesta al suo risultato</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#B4563C"/></marker></defs>
<rect x="14" y="20" width="292" height="104" rx="10" fill="#FFFDF8" stroke="#141413" stroke-width="2"/><text x="31" y="48" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="13" fill="#141413">tool_use</text><text x="31" y="65" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" fill="#6E6A5E">dal modello, nella prima risposta</text><text x="30" y="82" text-anchor="start" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12" fill="#B4563C">id</text><text x="64" y="82" text-anchor="start" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="11" fill="#6E6A5E">toolu_01A09q90qw90lq91</text><text x="30" y="100" text-anchor="start" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12" fill="#141413">name   input</text><text x="30" y="116" text-anchor="start" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="10.5" fill="#6E6A5E">quale strumento, con quali parametri</text><rect x="14" y="170" width="292" height="104" rx="10" fill="#E7EEED" stroke="#3F6C6A" stroke-width="2"/><text x="31" y="198" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="13" fill="#1F3B39">tool_result</text><text x="31" y="215" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" fill="#3F6C6A">da te, dentro un messaggio user</text><text x="30" y="232" text-anchor="start" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12" fill="#B4563C">tool_use_id</text><text x="122" y="232" text-anchor="start" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="11" fill="#6E6A5E">toolu_01A09q90qw90lq91</text><text x="30" y="250" text-anchor="start" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12" fill="#1F3B39">content  is_error</text><text x="30" y="266" text-anchor="start" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="10.5" fill="#3F6C6A">il risultato, e se l'esecuzione è fallita</text><path d="M14 88 L6 88 L6 238 L14 238" fill="none" stroke="#B4563C" stroke-width="2"/><text x="160" y="150" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11" fill="#B4563C">stesso identificatore: è l'unica cosa</text><text x="160" y="164" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11" fill="#B4563C">che accoppia richiesta e risultato</text>
</svg>
