<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 312" role="img" aria-label="Un vault Obsidian è una cartella sul filesystem: file markdown, una sottocartella di allegati e una sottocartella .obsidian con la configurazione. Nessun database e nessuna API">
