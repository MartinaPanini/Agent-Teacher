<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" role="img" aria-label="Gli eventi degli hook lungo una sessione: SessionStart, UserPromptSubmit, PreToolUse, PostToolUse, Stop e SessionEnd. Tre di questi possono bloccare l'azione con il codice di uscita 2">
<title>Gli eventi degli hook lungo una sessione: SessionStart, UserPromptSubmit, PreToolUse, PostToolUse, Stop e SessionEnd. Tre di questi possono bloccare l'azione con il codice di uscita 2</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#B4563C"/></marker></defs>
<text x="300" y="22" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12.5" fill="#141413">gli eventi lungo il ciclo di vita di una sessione</text><line x1="30" y1="86" x2="570" y2="86" stroke="#D3CEC0" stroke-width="3"/><circle cx="40" cy="86" r="5" fill="#6E6A5E"/><text x="40" y="68" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10.5" fill="#6E6A5E">SessionStart</text><circle cx="160" cy="86" r="7" fill="#B4563C"/><text x="160" y="68" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10.5" fill="#B4563C">UserPromptSubmit</text><text x="160" y="112" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="10" fill="#B4563C">può bloccare</text><circle cx="300" cy="86" r="7" fill="#B4563C"/><text x="300" y="68" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10.5" fill="#B4563C">PreToolUse</text><text x="300" y="112" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="10" fill="#B4563C">può bloccare</text><circle cx="410" cy="86" r="5" fill="#6E6A5E"/><text x="410" y="68" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10.5" fill="#6E6A5E">PostToolUse</text><circle cx="500" cy="86" r="7" fill="#B4563C"/><text x="500" y="68" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10.5" fill="#B4563C">Stop</text><text x="500" y="112" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="10" fill="#B4563C">può bloccare</text><circle cx="562" cy="86" r="5" fill="#6E6A5E"/><text x="562" y="68" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10.5" fill="#6E6A5E">SessionEnd</text><text x="300" y="160" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12" fill="#141413">Un hook di tipo command riceve un JSON su stdin e risponde con il codice</text><text x="300" y="178" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12" fill="#141413">di uscita. Zero: nessuna decisione. Due: errore bloccante.</text><rect x="150" y="200" width="300" height="44" rx="10" fill="#E7EEED" stroke="#3F6C6A" stroke-width="2"/><text x="167" y="227.0" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="13" fill="#1F3B39"></text><text x="300" y="227" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12" fill="#1F3B39">L'uscita 2 blocca l'azione, JSON o non JSON.</text>
</svg>
