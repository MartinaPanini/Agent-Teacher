<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 276" role="img" aria-label="Tre barre, turno 1, 5 e 10: la parte fissa resta uguale mentre lo storico accumulato allunga la richiesta a ogni turno">
