<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 290" role="img" aria-label="I client tool girano nel tuo codice e li esegui tu; i server tool girano sull'infrastruttura di Anthropic e il risultato arriva gia prodotto">
<title>I client tool girano nel tuo codice e li esegui tu; i server tool girano sull'infrastruttura di Anthropic e il risultato arriva gia prodotto</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#B4563C"/></marker></defs>
<text x="18" y="24" text-anchor="start" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12" fill="#141413">client tool</text><rect x="14" y="34" width="292" height="96" rx="10" fill="#FFFDF8" stroke="#141413" stroke-width="2"/><text x="31" y="87.0" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="13" fill="#141413"></text><text x="30" y="58" text-anchor="start" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" fill="#6E6A5E">i tuoi, più bash e text_editor</text><text x="30" y="82" text-anchor="start" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11" fill="#6E6A5E">il modello si ferma con stop_reason: tool_use,</text><text x="30" y="98" text-anchor="start" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11" fill="#6E6A5E">esegui tu nel tuo codice, rimandi tu il risultato</text><text x="30" y="118" text-anchor="start" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11" fill="#B4563C">il lavoro accade sulla tua macchina</text><text x="18" y="168" text-anchor="start" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12" fill="#141413">server tool</text><rect x="14" y="178" width="292" height="96" rx="10" fill="#E7EEED" stroke="#3F6C6A" stroke-width="2"/><text x="31" y="231.0" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="13" fill="#1F3B39"></text><text x="30" y="202" text-anchor="start" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" fill="#3F6C6A">web_search, web_fetch, code_execution</text><text x="30" y="226" text-anchor="start" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11" fill="#3F6C6A">esegue l'infrastruttura di Anthropic,</text><text x="30" y="242" text-anchor="start" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11" fill="#3F6C6A">il risultato torna già prodotto</text><text x="30" y="262" text-anchor="start" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11" fill="#B4563C">tu non gestisci nessuna esecuzione</text>
</svg>
